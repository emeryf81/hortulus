# Hortulus - Sätze für Assist (Sprachassistent von Home Assistant).
# Installiert mit dem Dienst garden_manager.install_voice_sentences.
language: de
intents:
  HortulusTasksToday:
    data:
      - sentences:
          - "was (muss|soll) ich [heute] im (Garten|Gemüsegarten|Gewächshaus) (tun|machen)"
          - "was gibt es [heute] im (Garten|Gemüsegarten) zu tun"
          - "(welche|was sind [meine]) (Gartenaufgaben|Gartenarbeiten) [für] [heute]"
  HortulusHarvest:
    data:
      - sentences:
          - "was kann ich [heute] ernten"
          - "was ist (erntereif|reif zum Ernten|reif zum Pflücken)"
  HortulusGreenhouse:
    data:
      - sentences:
          - "wie (warm|heiß|kalt) ist es im Gewächshaus"
          - "(welche|wie hoch ist die) Temperatur (hat das|im) Gewächshaus"
          - "wie geht es dem Gewächshaus"
  HortulusWater:
    data:
      - sentences:
          - "(muss|soll) ich [heute] [den Garten|die Pflanzen|die Beete] gießen"
          - "(braucht der Garten|brauchen die Pflanzen) Wasser"
  HortulusFrost:
    data:
      - sentences:
          - "(gibt es|kommt) [heute Nacht] Frost"
          - "wird es [heute Nacht] frieren"
          - "ist [heute Nacht] Frost (angesagt|vorhergesagt)"
  HortulusOverdue:
    data:
      - sentences:
          - "welche (Gartenaufgaben|Aufgaben) sind (überfällig|liegen geblieben)"
          - "was habe ich im Garten vergessen"
