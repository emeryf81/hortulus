<!doctype html>
<html lang="en"><head><title>Hortulus dev harness</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;font-family:Roboto,"DejaVu Sans",sans-serif}</style></head>
<body>
<script type="module">
  // Minimal ha-icon stand-in: renders an MDI-like glyph box so layouts keep their rhythm.
  const ICONS = await fetch("icons.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    attributeChangedCallback() { this.draw(); }
    connectedCallback() { this.draw(); }
    draw() {
      const d = ICONS[this.getAttribute("icon")] || "";
      this.style.cssText = "display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);vertical-align:middle;flex:none";
      (this.shadowRoot || this.attachShadow({ mode: "open" })).innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="${d}"/></svg>`;
    }
  });
  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") || "en";
  const data = await (await fetch(`data-${lang}.json`)).json();
  window.__calls = [];
  const subs = [];
  const hass = {
    language: lang, locale: { language: lang }, themes: { darkMode: params.get("dark") === "1" },
    user: { id: "u", is_admin: true, name: "Emery" },
    states: {
      "sensor.soil_moisture_bed_1": { entity_id: "sensor.soil_moisture_bed_1", state: "21", attributes: { device_class: "moisture", unit_of_measurement: "%" } },
      "sensor.soil_temp_bed_1": { entity_id: "sensor.soil_temp_bed_1", state: "13.4", attributes: { device_class: "temperature", unit_of_measurement: "°C" } },
      "sensor.greenhouse_temp": { entity_id: "sensor.greenhouse_temp", state: "29.5", attributes: { device_class: "temperature", unit_of_measurement: "°C" } },
      "weather.home": { entity_id: "weather.home", state: "partlycloudy", attributes: { friendly_name: "Thuis", temperature: 18.4, humidity: 64, wind_speed: 14, wind_speed_unit: "km/h", pressure: 1016, pressure_unit: "hPa" } },
      "valve.bed_1": { entity_id: "valve.bed_1", state: "closed", attributes: { friendly_name: "Kraan bed 1" } },
      "light.porch": { entity_id: "light.porch", state: "off", attributes: {} },
      "tts.google_nl": { entity_id: "tts.google_nl", state: "unknown", attributes: {} },
      "media_player.kitchen": { entity_id: "media_player.kitchen", state: "idle", attributes: { friendly_name: "Keuken" } },
    },
    services: { notify: { mobile_app_phone: {} } },
    connection: {
      async sendMessagePromise(msg) {
        window.__calls.push(msg);
        if (msg.type === "history/history_during_period") {
          // a believable soil-moisture curve: dries out, jumps after watering
          const out = {};
          const start = new Date(msg.start_time).getTime(), end = new Date(msg.end_time).getTime();
          for (const id of msg.entity_ids) {
            const pts = []; let v = 38;
            for (let t = start; t < end; t += 3 * 3600_000) {
              v -= 0.6; if (v < 22) v = 41;
              pts.push({ s: id.includes("rain") ? String(Math.max(0, Math.round(Math.sin(t / 9e7) * 6))) : v.toFixed(1), lu: t / 1000 });
            }
            out[id] = pts;
          }
          return out;
        }
        const type = msg.type.split("/").slice(1).join("/");
        if (type === "plants") return data.plants;
        if (type === "plan/check") {
          const ids = new Set(msg.plantings.map((p) => p.id));
          const enemy = msg.plantings.find((p) => p.plant_id === "kale") && msg.plantings.find((p) => p.plant_id === "tomato");
          return { score: enemy ? 32 : 64, pairs: enemy ? [{ a: [...ids][0], b: "pl_kale", kind: "enemy", severity: "error", score: -20, distance_cm: 5, key: "compat.enemy", params: { a: "Tomato", b: "Kale", reason: "Brassicas compete heavily for nutrients." } }] : [], rotation: [], out_of_bounds: [], timelines: {} };
        }
        if (type === "plan/save") { data.snapshot.revision += 1; return { revision: data.snapshot.revision }; }
        if (type === "plans/windows") return {};
        if (type === "plantings/season") return { season: msg.season, rows: (data.extras || {}).crop_rows || [] };
        if (type === "planting/update") {
          const row = ((data.extras || {}).crop_rows || []).find((r) => r.planting.id === msg.planting_id);
          if (row) Object.assign(row.planting, msg.changes);
          return { planting: row && row.planting, row, revision: data.snapshot.revision };
        }
        if (type === "analysis") return (data.extras || {}).analysis;
        if (type === "analysis/fix") return { revision: data.snapshot.revision };
        if (type === "analysis/still_possible") return (data.extras || {}).still_possible;
        if (type === "report/season") return { ...(data.extras || {}).report, season: msg.season };
        if (type === "planning") return (data.extras || {}).planning;
        if (type === "plan/compare") return (data.extras || {}).compare;
        if (type === "plantings/update_many") return { updated: msg.planting_ids.length, revision: data.snapshot.revision };
        if (type === "irrigation/test") return { entity_id: msg.entity_id, seconds: msg.seconds, before: "off", ok: true, opened: true, open_state: "open", closed: true, closed_state: "closed", pump: null };
        if (type === "irrigation/close") return { state: "closed" };
        if (type === "syslog/list") return { entries: [], more: false, total: 0 };
        if (type === "analysis/explain") return { ...(data.extras || {}).explain, plant_id: msg.plant_id };
        if (type === "year/preview") return (data.extras || {}).year_preview;
        if (type === "year/apply") return { season: msg.from_season + 1, carried: msg.planting_ids, skipped: [], activated: msg.activate, revision: data.snapshot.revision };
        const x = data.extras || {};
        if (type === "handbook/index") return x.handbook_index;
        if (type === "handbook/chapter") return x.handbook_chapters[msg.chapter_id];
        if (type === "handbook/search") {
          const q = msg.query.toLowerCase();
          return { results: Object.values(x.handbook_chapters).filter((c) => c.body.toLowerCase().includes(q)).map((c) => ({ id: c.id, title: c.title, score: 1, snippet: c.summary })) };
        }
        if (type === "print/render") return { pages: x.print_pages };
        if (type === "plan/autofill") return x.autofill;
        if (type === "advice") return x.advice;
        if (type === "qa/options") return x.qa_options;
        if (type === "qa/ask") return x.qa_answers[`${msg.subject}/${msg.problem}/${msg.target ?? ""}`] ?? Object.values(x.qa_answers)[0];
        if (type === "supplies") return x.supplies;
        if (type === "records/overview") return x.records;
        if (type === "climate/stats") return x.climate;
        if (type === "wall/data") return x.wall;
        if (type === "wall/layout") { x.wall_default ??= x.wall.layout; x.wall = { ...x.wall, layout: msg.layout ?? x.wall_default, custom: msg.layout != null }; return { layout: msg.layout }; }
        if (type.startsWith("cooking/")) {
          const c = x.cooking;
          const find = (spec) => c.recipes.find((r) => r.technique === spec.technique) ?? c.recipes[0];
          if (type === "cooking/suggest") return c;
          if (type === "cooking/render") {
            const r = find(msg.spec);
            return { recipe: { ...r, spec: { ...r.spec, ...msg.spec }, servings: msg.spec.servings ?? r.servings }, saved: false };
          }
          if (type === "cooking/book/save") {
            const r = find(msg.recipe.spec);
            c.book = [...c.book.filter((b) => b.id !== r.id), { ...r, saved: true, favorite: !!msg.recipe.favorite, shared: !!msg.recipe.shared, cooked: [] }];
            return { id: r.id, book: c.book };
          }
          if (type === "cooking/book/update") {
            const own = (b) => {
              const ch = msg.changes;
              if (!("ingredients" in ch) && !("steps" in ch)) return {};
              // [] goes back to the generated recipe (kept aside the first time the cook edits)
              const orig = b.original ?? { ingredients: b.ingredients, steps: b.steps };
              const ingredients = !("ingredients" in ch) ? b.ingredients : ch.ingredients.length
                ? [...ch.ingredients.map((i) => ({ ...i, id: i.id || i.name, group: i.group || "other", label: i.qty ? `${i.qty} ${i.unit}` : "" })), ...orig.ingredients.filter((i) => i.source === "basic")]
                : orig.ingredients;
              const steps = !("steps" in ch) ? b.steps : ch.steps.length ? ch.steps : orig.steps;
              const custom = ingredients !== orig.ingredients || steps !== orig.steps;
              return { ingredients, steps, custom, original: orig };
            };
            c.book = c.book.map((b) => (b.id === msg.recipe_id ? { ...b, ...msg.changes, ...own(b), cooked: msg.changes.cooked ? [...(b.cooked || []), "2026-08-02"] : b.cooked } : b));
            return { id: msg.recipe_id, book: c.book };
          }
          if (type === "cooking/book/delete") { c.book = c.book.filter((b) => b.id !== msg.recipe_id); return { book: c.book }; }
          if (type === "cooking/prefs") return { prefs: msg.prefs };
          if (type === "cooking/pdf") return { pdf: btoa("%PDF-1.4 mock"), filename: "hortulus-mock.pdf" };
          if (type === "cooking/send") return { sent: !msg.dry_run, title: "Boodschappen", text: "- kip (600 g)" };
          if (type === "cooking/to_todo") return { added: 3, skipped: 0 };
        }
        if (type === "irrigation/plan" || type === "irrigation/run") return { ...x.irrigation_plan, started: true };
        return {};
      },
      async subscribeMessage(cb, msg) {
        window.__calls.push(msg);
        if (msg.type === "weather/subscribe_forecast") {
          // a believable week: a frosty night, a hot day, some rain
          const now = new Date(); now.setMinutes(0, 0, 0);
          const conds = ["partlycloudy", "sunny", "rainy", "cloudy", "pouring", "sunny", "partlycloudy", "fog", "sunny", "rainy"];
          const forecast = msg.forecast_type === "hourly"
            ? Array.from({ length: 48 }, (_, i) => ({ datetime: new Date(now.getTime() + i * 3600e3).toISOString(), condition: conds[Math.floor(i / 6) % conds.length],
                temperature: 14 + 6 * Math.sin(((i + now.getHours() - 9) / 24) * 2 * Math.PI), precipitation: i % 9 === 4 ? 1.2 : i % 13 === 7 ? 0.4 : 0, is_daytime: ((now.getHours() + i) % 24) > 6 && ((now.getHours() + i) % 24) < 21 }))
            : Array.from({ length: 10 }, (_, i) => ({ datetime: new Date(now.getTime() + i * 86400e3).toISOString(), condition: conds[i],
                temperature: [21, 24, 17, 16, 15, 29, 22, 13, 19, 18][i], templow: [10, 12, 9, 6, 1, 14, 11, 3, 8, 9][i],
                precipitation: [0, 0, 6.2, 1.1, 12.5, 0, 0, 0.3, 0, 4.4][i], precipitation_probability: [10, 5, 80, 40, 95, 0, 10, 20, 5, 70][i] }));
          setTimeout(() => cb({ type: msg.forecast_type, forecast }), 10);
          return async () => {};
        }
        subs.push(cb); setTimeout(() => cb(data.snapshot), 10); return async () => {};
      },
    },
    config: { country: lang === "nl" ? "BE" : "GB", latitude: 51.05, longitude: 3.73 },
    fetchWithAuth: async () => new Response("{}"),
    callService: async () => ({}),
  };
  const el = document.createElement("hortulus-panel");
  el.hass = hass;
  el.narrow = params.get("narrow") === "1";
  // ?tabs=dashboard,planner: only these tabs (the website's read-only view of a shared garden)
  if (params.has("tabs")) el.panel = { config: { tabs: params.get("tabs").split(",").filter(Boolean) } };
  el.route = { prefix: "/hortulus", path: "/" + (params.get("tab") || "") };
  document.body.appendChild(el);
  window.addEventListener("error", (e) => (window.__errors = [...(window.__errors || []), String(e.message)]));
</script>
<script type="module" src="../../custom_components/garden_manager/frontend/hortulus-panel.js"></script>
</body></html>
